name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { php: ['8.1', '8.4'] } }
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: 'curl, json' }
      - run: composer validate --strict
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer install --no-interaction
      - run: php -r 'require "vendor/autoload.php"; new Hermetica\Client("hm_sk_test");'
      - run: php tests/client_test.php
